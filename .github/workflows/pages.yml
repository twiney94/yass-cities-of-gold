name: Check and deploy

# Every push to staging or main is checked; only main is deployed, so staging can collect changes until a release.
on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      discord_tag:
        description: Post an existing release's notes to Discord again (e.g. v0.4.1-alpha)
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Check the third-party notices are up to date
        run: npm run notices && git diff --exit-code public/THIRD_PARTY_NOTICES.txt
      - run: npm test
      - run: npm run build
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Each release gets a GitHub Release and a version tag, with notes listing the features and fixes it brings.
  release:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.notes.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish the release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(node --experimental-strip-types tools/release.ts notes.md)
          if [ -z "$tag" ]; then
            echo "The version has not changed since the last release."
            exit 0
          fi
          flags=()
          if [[ "$tag" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md "${flags[@]}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Posts a new release's notes, or an existing release's when the workflow is run by hand with its tag, to the
  # Discord channel whose webhook address is in the DISCORD_WEBHOOK_URL secret.
  discord:
    needs: release
    if: always() && (needs.release.outputs.tag != '' || inputs.discord_tag != '')
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TAG: ${{ needs.release.outputs.tag || inputs.discord_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post the release notes to Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.TAG }}
          PLAY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          node --experimental-strip-types tools/release.ts --discord "$TAG" notes.md "$RELEASE_URL" "$PLAY_URL" \
            | curl --fail --silent --show-error -H 'Content-Type: application/json' --data @- "$DISCORD_WEBHOOK_URL"
